[package]
name = "rashnu-ton-pool"
description = "TON-native escrow/payout contract for Rashnu's parallel TON pool"
version = "0.1.0"
license = "MIT"

[toolchain]
acton = "1.2.1"

[contracts.RashnuTonPool]
display-name = "RashnuTonPool"
src = "contracts/RashnuTonPool.tolk"
depends = []

[test]

[fmt]
width = 100
ignore = []

[scripts]
# Deploy scripts intentionally not written yet - need real decisions first
# (the actual TON testnet USDT minter address, its jetton-wallet code,
# real admin/operator/feeRecipient addresses) rather than placeholder values.
# See docs/ton-pool.md's "open questions" section.

[import-mappings]
acton = ".acton"
contracts = "contracts"
gen = "gen"
tests = "tests"
wrappers = "wrappers"

# Check full Acton.toml reference and all available keys:
# https://ton-blockchain.github.io/acton/docs/acton-toml
