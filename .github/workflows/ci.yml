name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Lint, typecheck, test (pnpm workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  contracts:
    name: Foundry build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Build contracts
        working-directory: contracts
        run: forge build

      - name: Test contracts
        working-directory: contracts
        run: forge test -vvv

  contracts-ton:
    name: TON pool contract build, lint, and test (Tolk/Acton)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ton-blockchain/setup-acton@v1

      - name: Build
        working-directory: contracts-ton
        run: acton build

      - name: Formatter
        working-directory: contracts-ton
        run: acton fmt --check

      - name: Linter
        working-directory: contracts-ton
        run: acton check --output-format github

      - name: Test
        working-directory: contracts-ton
        run: acton test
